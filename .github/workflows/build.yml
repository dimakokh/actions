name: Build DEX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install build-tools 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Build Xposed API 82
        run: |
          mkdir -p libs
          git clone --depth 1 --branch art https://github.com/rovo89/XposedBridge.git xposed-src
          cd xposed-src
          # Патчим build.gradle для работы с современным Gradle
          sed -i 's/jcenter/mavenCentral/g' build.gradle
          # Убираем подпись и прочие ненужные для сборки части (если скрипт упадёт)
          # Проще всего — использовать предсобранный JAR из репозитория
          if [ -f "XposedBridgeAPI-82.jar" ]; then
            cp XposedBridgeAPI-82.jar ../libs/
          else
            # Fallback: собираем сами через javac
            find . -name "*.java" > sources.txt
            javac -source 8 -target 8 -d ../libs/classes @sources.txt \
              -cp "$ANDROID_HOME/platforms/android-34/android.jar" 2>/dev/null || true
            cd ../libs/classes && jar cf ../XposedBridgeAPI-82.jar de/
          fi

      - name: Verify Xposed JAR exists
        run: |
          ls -la libs/XposedBridgeAPI-82.jar
          file libs/XposedBridgeAPI-82.jar
          unzip -l libs/XposedBridgeAPI-82.jar | head -5

      - name: Compile Java
        run: |
          mkdir -p out
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-34/android.jar:libs/XposedBridgeAPI-82.jar" \
            -d out \
            src/com/sendformat/noformat/NoFormatPlugin.java

      - name: Build DEX
        run: |
          mkdir -p dex_out
          "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --min-api 21 \
            --output dex_out \
            out/com/sendformat/noformat/*.class

      - name: Base64 DEX
        run: |
          base64 -w0 dex_out/classes.dex > dex_b64.txt
          echo "DEX size: $(wc -c < dex_out/classes.dex) bytes"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-output
          path: |
            dex_out/classes.dex
            dex_b64.txt
