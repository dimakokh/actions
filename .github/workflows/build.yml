name: Build DEX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''          # ← вот это исправляет ошибку
          log-accepted-android-sdk-licenses: false

      - name: Install build-tools 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Download Xposed API
        run: |
          mkdir -p libs
          curl -L -o libs/XposedBridgeAPI-82.jar \
            https://repo1.maven.org/maven2/de/robv/android/xposed/api/82/api-82.jar

      - name: Compile Java
        run: |
          mkdir -p out
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-34/android.jar:libs/XposedBridgeAPI-82.jar" \
            -d out \
            src/com/sendformat/noformat/NoFormatPlugin.java

      - name: Build DEX
        run: |
          mkdir -p dex_out
          "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --min-api 21 \
            --output dex_out \
            out/com/sendformat/noformat/*.class

      - name: Base64 DEX
        run: |
          base64 -w0 dex_out/classes.dex > dex_b64.txt
          echo "DEX size: $(wc -c < dex_out/classes.dex) bytes"
          echo "Base64 size: $(wc -c < dex_b64.txt) chars"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-output
          path: |
            dex_out/classes.dex
            dex_b64.txt
